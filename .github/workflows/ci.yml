# PRs: typecheck, test, build, then deploy the PR to staging (demo data only).
# Pushes to main: the same checks, then, once the owner approves the
# "production" environment, apply D1 migrations and deploy. See docs/DEPLOY.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history on pull requests: the catalog checks compare against the base branch.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The catalog and its feed validate; on a pull request, no benefit id from the base branch is missing.
      - name: Catalog check
        run: npm run catalog:check -- ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}
      # A "Daily refresh" pull request merges itself, so it may only change files under catalog/ (docs/SPEC-v9-daily-refresh.md §6).
      - name: Daily refresh may only touch catalog/
        if: github.event_name == 'pull_request' && startsWith(github.event.pull_request.title, 'Daily refresh')
        run: npm run refresh:guard -- --base origin/${{ github.base_ref }} --paths-only
      - run: npm run typecheck
      - run: npm test
      # Builds the Next.js app and the Cloudflare Worker bundle (.open-next/).
      - run: npm run cf:build
      - name: Worker bundle size
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry-run" | grep -i "total upload"

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Waits for the owner's approval (required reviewer on the "production" environment, main only).
    environment: production
    # Never run two deploys (and migrations) at once.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy (docs/DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:build
      - name: Find or create the D1 database
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:d1:ensure
      - name: Apply D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:migrate:remote
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:deploy

  # Staging: a second Worker and D1 database (wrangler.staging.jsonc) holding demo data only, in a
  # separate Cloudflare account. A D1 token can't be limited to one database, so a separate account is
  # what keeps pull-request code and its token away from production. Each pull request from this repo
  # is deployed there, so it can be tried and e2e-tested on the Workers runtime first.
  staging:
    name: Deploy to staging
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One staging database: deploy one pull request at a time, the latest wins.
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the staging secret
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice title=Staging deploy skipped::Add the STAGING_CLOUDFLARE_API_TOKEN and STAGING_CLOUDFLARE_ACCOUNT_ID repository secrets (a separate Cloudflare account) to deploy pull requests to staging (docs/DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:build
      - name: Find the staging D1 database
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:staging:d1:ensure
      - name: Apply D1 migrations (staging)
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:staging:migrate
      - name: Deploy (staging)
        if: steps.secrets.outputs.ready == 'true'
        # shell: bash adds pipefail, so a failed deploy fails the step even through tee.
        shell: bash
        run: npm run cf:staging:deploy | tee "$RUNNER_TEMP/deploy.log"
      - name: Staging address
        if: steps.secrets.outputs.ready == 'true'
        shell: bash
        run: |
          url=$(grep -o 'https://[^ ]*workers.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$url" ]; then echo "::error title=Staging::The deploy printed no workers.dev address."; exit 1; fi
          echo "::notice title=Staging::$url"
          echo "Staging: $url" >> "$GITHUB_STEP_SUMMARY"
