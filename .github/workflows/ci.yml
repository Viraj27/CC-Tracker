# PRs: typecheck, test, build. Pushes to main: the same, then apply D1
# migrations and deploy to Cloudflare Workers. See docs/DEPLOY.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Builds the Next.js app and the Cloudflare Worker bundle (.open-next/).
      - run: npm run cf:build
      - name: Worker bundle size
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dry-run" | grep -i "total upload"

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Never run two deploys (and migrations) at once.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy (docs/DEPLOY.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:build
      - name: Find or create the D1 database
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:d1:ensure
      - name: Apply D1 migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:migrate:remote
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: npm run cf:deploy
