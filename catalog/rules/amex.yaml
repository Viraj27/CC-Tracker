issuer: amex
rules:
  - id: amex-delta-gold-family
    name: Delta Gold welcome offer — "have or have had"
    issuer: amex
    effect: bonus
    description: >-
      You may not be eligible for a welcome offer if you have or have had the
      Delta SkyMiles Gold, Delta SkyMiles Platinum, or Delta SkyMiles Reserve
      card (or previous versions of these cards). Amex checks eligibility
      during the application and lets you withdraw before processing.
    check:
      type: lifetime_family
      families: [delta-skymiles-premium]
    source_url: https://www.americanexpress.com/us/credit-cards/card-application/apply/prospect/terms/delta-skymiles-gold-american-express-card/28310-10-0
    last_verified: 2026-10-16
    verified: true
    note: Only cards in the catalog with family delta-skymiles-premium (currently the Delta Gold) are matched; add Platinum/Reserve holdings with a catalog entry or check manually.
  - id: amex-1-in-5
    name: Amex 1 in 5 days
    issuer: amex
    effect: approval
    description: Amex reportedly approves at most 1 credit card in a rolling 5-day window.
    check:
      type: x_in_y
      max_new_accounts: 0
      window_days: 5
      counted_account_types: [personal, business]
      counted_issuers: [amex]
    source_url: https://www.doctorofcredit.com/brief-time-related-rules-imposed-american-express-chase-citi/
    last_verified: 2026-10-16
    verified: false
    note: Community data points (source is several years old); never published by Amex.
  - id: amex-2-in-90
    name: Amex 2 in 90 days
    issuer: amex
    effect: approval
    description: Amex reportedly approves at most 2 credit cards in a rolling 90-day window.
    check:
      type: x_in_y
      max_new_accounts: 1
      window_days: 90
      counted_account_types: [personal, business]
      counted_issuers: [amex]
    source_url: https://www.doctorofcredit.com/brief-time-related-rules-imposed-american-express-chase-citi/
    last_verified: 2026-10-16
    verified: false
    note: Community data points (source is several years old); never published by Amex.
